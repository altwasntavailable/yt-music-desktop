name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Build installer
        run: npm run dist

      - name: Build portable executable
        run: npm run dist:portable

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter *.exe | Where-Object {
            $_.Name -like "YT-Music-Desktop-Setup-*" -or $_.Name -like "YT-Music-Desktop-Portable-*"
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/YT-Music-Desktop-Setup-*.exe
            dist/YT-Music-Desktop-Portable-*.exe

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            (Get-ChildItem dist -Filter "YT-Music-Desktop-Setup-*.exe" | Select-Object -ExpandProperty FullName),
            (Get-ChildItem dist -Filter "YT-Music-Desktop-Setup-*.exe.blockmap" | Select-Object -ExpandProperty FullName),
            (Get-ChildItem dist -Filter "YT-Music-Desktop-Portable-*.exe" | Select-Object -ExpandProperty FullName),
            (Resolve-Path "dist\latest.yml").Path,
            (Resolve-Path "dist\SHA256SUMS.txt").Path
          )
          gh release create $tag @assets --title "YT Music Desktop $tag" --generate-notes --verify-tag
