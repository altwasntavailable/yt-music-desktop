name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Syntax check
        run: |
          node --check src/main/main.js
          node --check src/main/watchdog.js
          node --check src/main/downloads.js
          node --check src/main/download-utils.js
          node --check src/main/fs-utils.js
          node --check src/main/desktop-integration.js
          node --check src/main/tray.js
          node --check src/main/config.js
          node --check src/main/discord.js
          node --check src/main/lyrics.js
          node --check src/main/sponsorblock.js
          node --check src/main/updater.js
          node --check src/main/browser-auth.js
          node --check src/preload/chrome-preload.js
          node --check src/renderer/app.js
          node --check scripts/generate-icons.js

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Unit tests
        run: npm test

      - name: Ensure Electron binary
        shell: pwsh
        run: |
          if (!(Test-Path node_modules\electron\dist\electron.exe)) {
            node node_modules\electron\install.js
          }

      - name: Build unpacked Windows app
        run: npm run pack
