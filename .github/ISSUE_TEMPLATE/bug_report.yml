name: Bug report
description: Report a crash, playback problem, or download issue.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing YT Music Desktop. Please do not paste cookies, tokens, or full Google account details.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: Playback stopped after sleep, the Offline panel showed an error, etc.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Found in Settings → About or the title bar.
      placeholder: 1.2.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: |
        For download issues, check the Offline panel's Last error line and
        `%APPDATA%\YT Music Desktop\downloads\downloads.log`.
        For recovery/watchdog issues, check `%APPDATA%\YT Music Desktop\watchdog.log`.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am using the latest release.
          required: true
        - label: I searched existing issues before opening this report.
          required: true
