name: Feature request
description: Suggest a feature or quality-of-life improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please explain the problem first, then the proposed solution. Screenshots or mockups are welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: I want to ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: Add a button that ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions.
          required: true
